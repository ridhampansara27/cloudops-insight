<!doctype html>
<html lang="en">
  <head>
    <!-- Define the document character encoding. -->
    <meta charset="UTF-8" />

    <!-- Make the interface responsive on mobile devices. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Define a concise browser-tab description. -->
    <meta
      name="description"
      content="CloudOps Insight cloud resource monitoring and FinOps platform."
    />

    <!-- Allow the browser UI to match light and dark themes. -->
    <meta
      name="color-scheme"
      content="light dark"
    />

    <!-- Define the browser-tab title. -->
    <title>CloudOps Insight</title>
  </head>

  <body>
    <!-- React mounts the complete application inside this element. -->
    <div id="root"></div>

    <!-- Load the TypeScript application entry point. -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
