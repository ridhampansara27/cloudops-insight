# Run worker processes automatically according to available CPU.
worker_processes auto;

# Store the PID somewhere writable by the non-root nginx user.
pid /tmp/nginx/nginx.pid;

events {
    # Allow enough concurrent local/demo connections.
    worker_connections 1024;
}

http {
    # Load standard MIME mappings.
    include /etc/nginx/mime.types;

    # Provide a safe fallback content type.
    default_type application/octet-stream;

    # Send access logs to the container log stream.
    access_log /dev/stdout;

    # Send NGINX errors to stderr.
    error_log /dev/stderr warn;

    # Enable efficient static file serving.
    sendfile on;

    # Configure writable non-root temporary locations.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Load CloudOps site configuration.
    include /etc/nginx/conf.d/*.conf;
}