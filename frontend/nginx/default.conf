server {
    # Use an unprivileged container port.
    listen 8080;

    # Accept any Kubernetes/Docker host name.
    server_name _;

    # Serve compiled React assets.
    root /usr/share/nginx/html;

    # Default Vite entry document.
    index index.html;

    # Lightweight frontend health endpoint.
    location = /healthz {
        # Avoid health endpoint logs.
        access_log off;

        # Return success without touching FastAPI.
        return 200 "ok\n";
    }

    # Never aggressively cache the SPA entry document.
    #
    # Every deployment can point index.html at a different hashed
    # JavaScript bundle, so browsers must revalidate this file.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Vite gives compiled assets content-hashed filenames.
    #
    # These files are immutable and can therefore be cached for one
    # year without risking stale application code after deployments.
    location /assets/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Forward API requests to the internal backend Service.
    location /api/ {
        # Preserve the original HTTP host information.
        proxy_set_header Host $host;

        # Preserve client forwarding information.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Send the request to FastAPI.
        proxy_pass http://cloudops-backend:8000;
    }

    # Forward backend health endpoints when needed.
    location /health/ {
        proxy_pass http://cloudops-backend:8000;
    }

    # Support React Router browser routes.
    location / {
        # Serve a real file when it exists.
        #
        # Otherwise return index.html so React Router can resolve
        # URLs such as /cloud/resources/<uuid>.
        try_files $uri $uri/ /index.html;
    }
}