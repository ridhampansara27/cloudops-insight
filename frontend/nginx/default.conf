# Preserve the original browser route for canonical metadata.
#
# $request_uri survives React Router's internal /index.html fallback.
# Query parameters are deliberately excluded from canonical URLs.
map $request_uri $cloudops_canonical_path {
    default /;
    ~^/index\.html(?:\?.*)?$ /;
    ~^(?<cloudops_path>[^?]+) $cloudops_path;
}
server {
    # Use an unprivileged container port.
    listen 8080;

    # The same image is used inside Kubernetes and during local container
    # verification, so hostname enforcement remains a deployment-layer
    # concern rather than hard-coding one public hostname into this image.
    server_name _;

    # Keep NGINX-generated redirects relative to the current browser origin.
    #
    # Cloudflare Tunnel connects to this container over internal HTTP:8080
    # even when the public request used HTTPS. Without this setting, NGINX
    # canonicalization redirects such as /api -> /api/ can expose the
    # internal scheme and port as http://<public-host>:8080/api/.
    #
    # A relative Location header preserves the browser's public HTTPS origin.
    absolute_redirect off;

    # Serve compiled React assets.
    root /usr/share/nginx/html;

    # Default Vite entry document.
    index index.html;

    # API and health responses inherit HSTS even though their remaining
    # security headers are supplied by FastAPI itself.
    add_header Strict-Transport-Security "max-age=31536000" always;


    # --------------------------------------------------------
    # Frontend health endpoint
    # --------------------------------------------------------

    location = /healthz {
        # Avoid health endpoint logs.
        access_log off;

        # Return success without touching FastAPI.
        return 200 "ok\n";
    }


    # --------------------------------------------------------
    # SPA entry document
    # --------------------------------------------------------

    location = /index.html {
        # Inject route-aware canonical metadata into the SPA shell.
        #
        # Both placeholders originate from frontend/index.html.
        sub_filter_once off;
        sub_filter "__CLOUDOPS_CANONICAL_URL__" "https://cloudopsinsight.tech$cloudops_canonical_path";
        # NGINX does not inherit server-level add_header values when a
        # location defines its own headers, so load the complete frontend
        # security policy explicitly.
        include /etc/nginx/snippets/cloudops-security-headers.conf;

        # Every deployment may point index.html at a different hashed
        # JavaScript bundle. Never retain the shell across deployments.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }


    # --------------------------------------------------------
    # Immutable Vite assets
    # --------------------------------------------------------

    location /assets/ {
        include /etc/nginx/snippets/cloudops-security-headers.conf;

        # Never fall back to the SPA shell for a missing hashed asset.
        try_files $uri =404;

        # Vite content hashes make these files safe to cache for one year.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }


    # --------------------------------------------------------
    # Backend API
    # --------------------------------------------------------

    # Avatar uploads intentionally allow a larger request body than the
    # default NGINX 1 MB limit. The backend independently enforces a 5 MB raw
    # file limit, while 6 MB here leaves room for multipart framing overhead.
    location = /api/v1/auth/me/avatar {
        client_max_body_size 6m;

        # Preserve the original application host.
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://cloudops-backend:8000;
    }


    location /api/ {
        # Preserve the original application host.
        proxy_set_header Host $host;

        # Forward operational proxy information.
        #
        # FastAPI's commercial rate limiter deliberately does not trust
        # X-Forwarded-For. Cloudflare client-IP trust is handled separately
        # and remains disabled until the controlled production rollout.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Send requests to the internal FastAPI Service.
        proxy_pass http://cloudops-backend:8000;
    }


    # --------------------------------------------------------
    # Backend health routes
    # --------------------------------------------------------

    location /health/ {
        proxy_pass http://cloudops-backend:8000;
    }


    # --------------------------------------------------------
    # React Router / non-hashed root assets
    # --------------------------------------------------------

    location / {
        include /etc/nginx/snippets/cloudops-security-headers.conf;

        # Files outside /assets are not guaranteed to have content hashes.
        # Require revalidation instead of assigning an immutable lifetime.
        add_header Cache-Control "no-cache" always;

        # Serve a real file when present. Otherwise return index.html so
        # React Router can resolve deep links such as /settings and
        # /cloud/resources/<uuid>.
        try_files $uri $uri/ /index.html;
    }
}