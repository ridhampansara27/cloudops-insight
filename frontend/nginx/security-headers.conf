# ============================================================
# CloudOps browser-facing security headers.
#
# This snippet is intentionally included inside frontend-serving
# locations because NGINX add_header inheritance stops when a child
# location defines its own add_header directives.
# ============================================================

# Restrict browser resource loading to CloudOps itself.
#
# React dynamically updates element style properties, so style attributes
# receive their own narrowly scoped CSP permission. Inline JavaScript remains
# forbidden because script-src contains no unsafe-inline allowance.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; media-src 'self'; manifest-src 'self'; worker-src 'self'" always;

# Prevent browsers from MIME-sniffing static responses.
add_header X-Content-Type-Options "nosniff" always;

# Legacy frame defense alongside CSP frame-ancestors.
add_header X-Frame-Options "DENY" always;

# Do not disclose the current CloudOps page through browser referrers.
add_header Referrer-Policy "no-referrer" always;

# Disable browser capabilities CloudOps does not currently need.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Isolate the application browsing context from cross-origin opener state.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Disable obsolete Adobe cross-domain policy discovery.
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Ask browsers to use HTTPS for this host for one year.
#
# We deliberately omit includeSubDomains/preload until every relevant
# hostname is intentionally covered by the production HTTPS policy.
add_header Strict-Transport-Security "max-age=31536000" always;