[project]
name = "cloudops-insight-backend"
version = "0.1.0"
description = "FastAPI backend for CloudOps Insight"
authors = [
    {name = "ridhampansara27",email = "ridhampansara27@gmail.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "redis (==6.4.0)",
    "python-json-logger (>=4.1.0,<5.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "email-validator (>=2.3.0,<3.0.0)",
    "boto3[crt] (>=1.43.72,<2.0.0)",
    "celery[redis] (>=5.6.3,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


# Configure Poetry-specific project behavior.
[tool.poetry]

# Treat this repository as an application instead of a distributable package.
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
