name: CloudOps CI/CD

# ------------------------------------------------------------
# Workflow triggers
# ------------------------------------------------------------

on:
  # Validate every pull request.
  pull_request:

  # Deploy only after code reaches main.
  push:
    branches:
      - main

  # Allow manual execution from GitHub.
  workflow_dispatch:


# Restrict the default GITHUB_TOKEN.
permissions:
  contents: read


# ------------------------------------------------------------
# Shared image metadata
# ------------------------------------------------------------

env:
  REGISTRY: ghcr.io

  BACKEND_IMAGE: >-
    ghcr.io/${{ github.repository_owner }}/cloudops-insight-backend

  FRONTEND_IMAGE: >-
    ghcr.io/${{ github.repository_owner }}/cloudops-insight-frontend

  # Immutable application version.
  IMAGE_TAG: sha-${{ github.sha }}


jobs:

  # ==========================================================
  # Backend quality
  # ==========================================================

  backend-quality:
    name: Backend quality

    runs-on: ubuntu-24.04

    services:

      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: cloudops
          POSTGRES_USER: cloudops
          POSTGRES_PASSWORD: cloudops_ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U cloudops -d cloudops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd
          "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:
      DATABASE_URL: >-
        postgresql+asyncpg://cloudops:cloudops_ci_password@127.0.0.1:5432/cloudops

      REDIS_URL: redis://127.0.0.1:6379/0

      CELERY_BROKER_URL: redis://127.0.0.1:6379/1

      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2

      JWT_SECRET: >-
        ci-only-jwt-secret-do-not-use-in-production-1234567890

      SEED_ADMIN_EMAIL: admin@example.com

      SEED_ADMIN_NAME: CloudOps CI Administrator

      SEED_ADMIN_PASSWORD: ci-only-password


    steps:

      # Checkout application source.
      - name: Checkout repository

        uses: actions/checkout@v6


      # Install the Python version used by CloudOps.
      - name: Set up Python

        uses: actions/setup-python@v7

        with:
          python-version: "3.13"


      # Install Poetry.
      - name: Install Poetry

        run: |
          python -m pip install --upgrade pip
          pip install poetry


      # Install backend dependencies.
      - name: Install backend dependencies

        working-directory: backend

        run: |
          poetry install --no-interaction


      # Verify schema migration works from an empty database.
      - name: Apply database migrations

        working-directory: backend

        run: |
          poetry run alembic upgrade head


      # Check Python lint rules.
      - name: Ruff check

        working-directory: backend

        run: |
          poetry run ruff check app tests scripts


      # Check source formatting.
      - name: Ruff format check

        working-directory: backend

        run: |
          poetry run ruff format --check app tests scripts


      # Run backend tests.
      - name: Run pytest

        working-directory: backend

        run: |
          poetry run pytest -v


      # Ensure SQLAlchemy models do not require another migration.
      - name: Check Alembic metadata

        working-directory: backend

        run: |
          poetry run alembic check



  # ==========================================================
  # Frontend quality
  # ==========================================================

  frontend-quality:
    name: Frontend quality

    runs-on: ubuntu-24.04


    steps:

      # Checkout application source.
      - name: Checkout repository

        uses: actions/checkout@v6


      # Install Node.js.
      - name: Set up Node.js

        uses: actions/setup-node@v7

        with:
          node-version: "22"

          cache: npm

          cache-dependency-path: frontend/package-lock.json


      # Install exactly the locked dependencies.
      - name: Install frontend dependencies

        working-directory: frontend

        run: |
          npm ci


      # Run lint, TypeScript, and production build validation.
      - name: Check frontend

        working-directory: frontend

        run: |
          npm run check



  # ==========================================================
  # Docker build, scan and publish
  # ==========================================================

  publish-images:
    name: Build, scan and publish images

    needs:
      - backend-quality
      - frontend-quality

    runs-on: ubuntu-24.04

    permissions:
      # Read application source.
      contents: read

      # Publish containers into GHCR.
      packages: write

    steps:

      # Checkout application repository.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Enable ARM64 emulation on the amd64 GitHub-hosted runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # Configure Docker Buildx.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate to GitHub Container Registry only when images
      # are allowed to be published.
      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main'
          )
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------
      # Backend image - linux/amd64
      # ------------------------------------------------------

      - name: Build backend image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          push: false
          tags: >-
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}-amd64
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=max,scope=backend-amd64

      - name: Scan backend image (amd64)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: >-
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}-amd64
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # ------------------------------------------------------
      # Backend image - linux/arm64
      # ------------------------------------------------------

      - name: Build backend image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/arm64
          load: true
          push: false
          tags: >-
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}-arm64
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

      - name: Scan backend image (arm64)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: >-
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}-arm64
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # ------------------------------------------------------
      # Frontend image - linux/amd64
      # ------------------------------------------------------

      - name: Build frontend image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          push: false
          tags: >-
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}-amd64
          build-args: |
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=frontend-amd64
          cache-to: type=gha,mode=max,scope=frontend-amd64

      - name: Scan frontend image (amd64)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: >-
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}-amd64
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # ------------------------------------------------------
      # Frontend image - linux/arm64
      # ------------------------------------------------------

      - name: Build frontend image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/arm64
          load: true
          push: false
          tags: >-
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}-arm64
          build-args: |
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64

      - name: Scan frontend image (arm64)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: >-
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}-arm64
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # Publish only after all four architecture-specific images
      # have successfully built and passed the Trivy security gate.
      - name: Push validated architecture images
        if: >-
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main'
          )
        shell: bash
        run: |
          set -euo pipefail

          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}-amd64"
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}-arm64"

          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}-amd64"
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}-arm64"

      # Combine the validated architecture images behind the same
      # immutable application tag used by GitOps.
      - name: Create multi-platform image manifests
        if: >-
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main'
          )
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            "${BACKEND_IMAGE}:${IMAGE_TAG}-amd64" \
            "${BACKEND_IMAGE}:${IMAGE_TAG}-arm64"

          docker buildx imagetools create \
            --tag "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            "${FRONTEND_IMAGE}:${IMAGE_TAG}-amd64" \
            "${FRONTEND_IMAGE}:${IMAGE_TAG}-arm64"

      # Fail publication if either final manifest does not expose
      # both required Linux architectures.
      - name: Verify multi-platform image manifests
        if: >-
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main'
          )
        shell: bash
        run: |
          set -euo pipefail

          for image in \
            "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          do
            echo "Verifying ${image}"

            docker buildx imagetools inspect "${image}" --raw |
              jq -e '
                [.manifests[].platform |
                  "\(.os)/\(.architecture)"
                ] as $platforms
                | ($platforms | index("linux/amd64")) != null
                  and
                  ($platforms | index("linux/arm64")) != null
              '
          done

  # ==========================================================
  # Propose GitOps deployment
  # ==========================================================

  update-gitops:
    name: Propose development GitOps deployment

    # Only publish deployment state after code from main has
    # successfully produced and scanned immutable container images.
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )

    needs:
      - publish-images

    runs-on: ubuntu-24.04

    steps:

      # Checkout the separate repository containing the desired
      # Kubernetes deployment state.
      - name: Checkout GitOps repository
        uses: actions/checkout@v6

        with:
          repository: ridhampansara27/cloudops-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops


      # Update both development environments to the exact immutable
      # application images created by this workflow.
      #
      # We intentionally update:
      #   - environments/dev       -> local/Kind development
      #   - environments/aws-dev   -> AWS EKS development
      #
      # The parser follows the backend/frontend YAML sections rather
      # than relying on comments being present in the values files.
      - name: Update development image versions
        shell: bash

        run: |
          python <<'PY'
          from pathlib import Path
          import os


          BACKEND_IMAGE = os.environ["BACKEND_IMAGE"]
          FRONTEND_IMAGE = os.environ["FRONTEND_IMAGE"]
          IMAGE_TAG = os.environ["IMAGE_TAG"]


          FILES = [
              Path("gitops/environments/dev/values.yaml"),
              Path("gitops/environments/aws-dev/values.yaml"),
          ]


          def update_values_file(path: Path) -> None:
              """Update backend/frontend image repository and tag values."""

              lines = path.read_text(encoding="utf-8").splitlines()

              output = []

              component = None
              inside_image = False

              for line in lines:
                  stripped = line.strip()
                  indentation = len(line) - len(line.lstrip())


                  # Top-level backend/frontend sections.
                  if indentation == 0 and stripped == "backend:":
                      component = "backend"
                      inside_image = False

                  elif indentation == 0 and stripped == "frontend:":
                      component = "frontend"
                      inside_image = False

                  elif indentation == 0 and stripped.endswith(":"):
                      component = None
                      inside_image = False


                  # image: is nested inside backend or frontend.
                  if (
                      component in {"backend", "frontend"}
                      and indentation == 2
                      and stripped == "image:"
                  ):
                      inside_image = True

                      output.append(line)
                      continue


                  # Leaving the image mapping.
                  if (
                      inside_image
                      and stripped
                      and indentation <= 2
                  ):
                      inside_image = False


                  if inside_image and stripped.startswith("repository:"):
                      image = (
                          BACKEND_IMAGE
                          if component == "backend"
                          else FRONTEND_IMAGE
                      )

                      line = (
                          f'{line[:indentation]}repository: '
                          f'"{image}"'
                      )


                  elif inside_image and stripped.startswith("tag:"):
                      line = (
                          f'{line[:indentation]}tag: '
                          f'"{IMAGE_TAG}"'
                      )


                  output.append(line)


              path.write_text(
                  "\n".join(output) + "\n",
                  encoding="utf-8",
              )


          for values_file in FILES:
              update_values_file(values_file)

              print(
                  f"Updated {values_file} "
                  f"to application version {IMAGE_TAG}"
              )
          PY


      # Never push deployment changes directly into GitOps main.
      # Create an immutable deployment proposal branch instead.
      - name: Create GitOps deployment branch
        working-directory: gitops
        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}

        run: |
          set -euo pipefail

          DEPLOY_BRANCH="deploy/${IMAGE_TAG}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Make workflow retries idempotent.
          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            "${DEPLOY_BRANCH}" >/dev/null 2>&1; then

            echo "Deployment branch ${DEPLOY_BRANCH} already exists."

            EXISTING_PR="$(
              gh pr list \
                --repo ridhampansara27/cloudops-gitops \
                --head "${DEPLOY_BRANCH}" \
                --state all \
                --json url \
                --jq '.[0].url // empty'
            )"

            if [ -n "${EXISTING_PR}" ]; then
              echo "Deployment PR already exists: ${EXISTING_PR}"
              exit 0
            fi

            echo "Deployment branch exists but has no PR."
            echo "Creating the missing GitOps pull request."

            gh pr create \
              --repo ridhampansara27/cloudops-gitops \
              --base main \
              --head "${DEPLOY_BRANCH}" \
              --title "deploy(dev): ${IMAGE_TAG}" \
              --body "Promote CloudOps application version \`${IMAGE_TAG}\` to the development environments."

            exit 0
          fi

          git checkout -b "${DEPLOY_BRANCH}"

          git add \
            environments/dev/values.yaml \
            environments/aws-dev/values.yaml

          if git diff --cached --quiet; then
            echo "GitOps already uses ${IMAGE_TAG}."
            exit 0
          fi

          git commit -m "deploy(dev): ${IMAGE_TAG}"

          git push \
            --set-upstream \
            origin \
            "${DEPLOY_BRANCH}"

          gh pr create \
            --repo ridhampansara27/cloudops-gitops \
            --base main \
            --head "${DEPLOY_BRANCH}" \
            --title "deploy(dev): ${IMAGE_TAG}" \
            --body "## Deployment

          Promote CloudOps application version \`${IMAGE_TAG}\` to the development environments.

          ## Environments

          - local/Kind development
          - AWS EKS development

          ## Images

          - backend: \`${BACKEND_IMAGE}:${IMAGE_TAG}\`
          - frontend: \`${FRONTEND_IMAGE}:${IMAGE_TAG}\`

          This PR was generated automatically after application CI, image build, and Trivy security scanning succeeded."
