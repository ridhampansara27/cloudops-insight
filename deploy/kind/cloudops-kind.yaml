# Use Kind's cluster configuration API.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Create one control-plane and two worker nodes.
nodes:

  # ----------------------------------------------------------
  # Control plane
  # ----------------------------------------------------------

  - role: control-plane

    # Mark this node as our local ingress node.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    # Map browser HTTP traffic into the Kind node.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP

      # Reserve HTTPS now for later TLS work.
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP

  # ----------------------------------------------------------
  # Workers
  # ----------------------------------------------------------

  - role: worker

  - role: worker