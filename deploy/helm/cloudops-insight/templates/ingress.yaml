{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: cloudops-insight

spec:
  # Ask ingress-nginx to manage this resource.
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:
          # Send all browser traffic to frontend NGINX.
          #
          # Frontend NGINX then proxies /api requests internally
          # to cloudops-backend.
          - path: /
            pathType: Prefix

            backend:
              service:
                name: cloudops-frontend

                port:
                  number: 8080

{{- end }}