apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudops-frontend

spec:
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app: cloudops-frontend

  template:
    metadata:
      labels:
        app: cloudops-frontend

    spec:
      containers:
        - name: frontend

          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"

          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080

          startupProbe:
            httpGet:
              path: /healthz
              port: http

            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /healthz
              port: http

            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: http

            periodSeconds: 20

          resources:
{{ toYaml .Values.frontend.resources | indent 12 }}

---
apiVersion: v1
kind: Service

metadata:
  name: cloudops-frontend

spec:
  selector:
    app: cloudops-frontend

  ports:
    - name: http
      port: 8080
      targetPort: http

  type: ClusterIP