apiVersion: v1
kind: Service
metadata:
  name: cloudops-redis

spec:
  selector:
    app: cloudops-redis

  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloudops-redis

  template:
    metadata:
      labels:
        app: cloudops-redis

    spec:
      containers:
        - name: redis

          image: {{ .Values.redis.image | quote }}

          ports:
            - containerPort: 6379
              name: redis

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping

            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi