# ------------------------------------------------------------
# Application runtime
# ------------------------------------------------------------

runtime:
  # APP_ENV describes lifecycle state, not infrastructure.
  #
  # Production deployments MUST override this with:
  #
  #   appEnv: production
  #
  # The default chart remains suitable for local Kind development.
  appEnv: development

  debug: false

  # Local browser origin used by the default Kind installation.
  frontendBaseUrl: "http://cloudops.local"

  corsOrigins: "http://localhost:5173,http://localhost:8080,http://cloudops.local"

  # Keep self-service commercial registration fail-closed.
  publicSignupEnabled: false

  smtp:
    # Local chart leaves delivery unconfigured.
    #
    # Production must provide host/from configuration here and credentials
    # through the existing Kubernetes Secret.
    host: ""

    port: 587

    fromEmail: "no-reply@example.com"

    fromName: "CloudOps Insight"

    starttls: true

    timeoutSeconds: 10

  refreshCookie:
    # Local Kind ingress is HTTP by default.
    #
    # Production MUST override this with true.
    secure: false

    sameSite: "lax"

    path: "/api/v1/auth"

    domain: ""

  rateLimit:
    enabled: true

    # Keep disabled until the backend origin is verified to be reachable
    # exclusively through the trusted Cloudflare path.
    trustCloudflareConnectingIp: false


# ------------------------------------------------------------
# Backend
# ------------------------------------------------------------

backend:
  replicaCount: 2

  image:
    repository: cloudops-backend
    tag: local
    pullPolicy: IfNotPresent

  service:
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 192Mi

    limits:
      cpu: 500m
      memory: 512Mi


# ------------------------------------------------------------
# Frontend
# ------------------------------------------------------------

frontend:
  replicaCount: 2

  image:
    repository: cloudops-frontend
    tag: local
    pullPolicy: IfNotPresent

  service:
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi

    limits:
      cpu: 250m
      memory: 256Mi


# ------------------------------------------------------------
# Celery worker
# ------------------------------------------------------------

worker:
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 192Mi

    limits:
      cpu: 500m
      memory: 512Mi


# ------------------------------------------------------------
# Celery Beat
# ------------------------------------------------------------

beat:
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

    limits:
      cpu: 250m
      memory: 256Mi


# ------------------------------------------------------------
# PostgreSQL -- local Kind only
# ------------------------------------------------------------

postgres:
  image: postgres:17-alpine

  database: cloudops

  username: cloudops

  storage:
    size: 2Gi


# ------------------------------------------------------------
# Redis -- local Kind only
# ------------------------------------------------------------

redis:
  image: redis:7-alpine


# ------------------------------------------------------------
# Secret references
# ------------------------------------------------------------

secrets:
  # The chart never creates commercial authentication secrets.
  #
  # Production secret material remains external to this repository.
  existingSecret: cloudops-secrets


# ------------------------------------------------------------
# Ingress
# ------------------------------------------------------------

ingress:
  enabled: true

  className: nginx

  host: cloudops.local


# ------------------------------------------------------------
# Autoscaling
# ------------------------------------------------------------

autoscaling:
  enabled: true

  minReplicas: 2

  maxReplicas: 5

  targetCPUUtilizationPercentage: 70