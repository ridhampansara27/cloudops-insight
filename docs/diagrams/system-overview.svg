<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CloudOps Insight production architecture</title>
  <desc id="desc">Users enter through Cloudflare Tunnel into OCI OKE. A React frontend calls FastAPI, PostgreSQL persists tenant data, and Redis coordinates Celery. The backend assumes read-only roles in customer AWS accounts. GitHub Actions, GHCR, GitOps and Argo CD deliver reviewed images; OCI storage protects PostgreSQL.</desc>
